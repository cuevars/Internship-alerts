name: Internship Radar
on:
  push:
    branches: [main]
    paths:
      - radar.py
      - sources.py
      - config.json
      - tests/**
      - .github/workflows/radar.yml
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: internship-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Find and notify
        id: radar
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
        run: python radar.py
      - name: Save scan status, shortlist and delivered IDs
        if: always() && steps.radar.outcome != 'skipped'
        run: |
          git config user.name "internship-radar[bot]"
          git config user.email "internship-radar@users.noreply.github.com"
          for file in state.json scan-status.md matches.md; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update internship scan status and alert history"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-shortlist
          path: matches.html
          if-no-files-found: ignore
      - name: Report scan failure
        if: steps.radar.outcome == 'failure'
        run: exit 1
